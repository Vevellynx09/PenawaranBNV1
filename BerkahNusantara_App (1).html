<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CV. Berkah Nusantara – Sistem Penawaran</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef1f5;font-size:13px;color:#1a1a2e;min-height:100vh}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 11px;border:1.5px solid #d0d7de;border-radius:7px;background:#fff;color:#1a1a2e;outline:none;transition:border .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:#1a3a6b;box-shadow:0 0 0 3px rgba(26,58,107,.11)}
button{font-family:inherit;cursor:pointer;border:none;transition:all .15s}
label{display:block;font-size:11px;font-weight:600;color:#7a8492;margin-bottom:4px}
.card{background:#fff;border-radius:12px;border:1px solid #e1e4e8;padding:18px 22px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:#1a3a6b;color:#fff}.btn-primary:hover{background:#0f2848}
.btn-green{background:#2e7d32;color:#fff}.btn-green:hover{background:#1b5e20}
.btn-brown{background:#5d4037;color:#fff}.btn-brown:hover{background:#3e2723}
.btn-ghost{background:#fff;color:#1a1a2e;border:1.5px solid #d0d7de}.btn-ghost:hover{background:#f5f8fc}
.btn-red{background:#b71c1c;color:#fff}.btn-red:hover{background:#7f0000}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn-full{width:100%;justify-content:center;padding:11px}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{background:#1a3a6b;color:#fff;padding:9px 10px;font-size:11px;font-weight:600;text-align:left}
.tbl th.r{text-align:right}.tbl th.c{text-align:center}
.tbl td{padding:7px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
.tbl tbody tr:hover td{background:#f5f8fc}
.tbl td.r{text-align:right}.tbl td.c{text-align:center}
.tbl-servis th{background:#5d4037!important}
.tabBtn{padding:8px 15px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.75);font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;border:none;white-space:nowrap}
.tabBtn.on{background:#e67e22;color:#fff;font-weight:700}
.tabBtn:hover:not(.on){background:rgba(255,255,255,.22);color:#fff}
#drop-wrap{position:absolute;width:100%;top:calc(100% + 5px);left:0;z-index:500}
.drop{background:#fff;border:1.5px solid #c8cdd5;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:360px;overflow-y:auto}
.ditem{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #f0f2f5;gap:10px}
.ditem:last-child{border-bottom:none}
.ditem:hover,.ditem.hl{background:#f0f6ff}
.mono{font-family:'Courier New',monospace;color:#1a3a6b;font-weight:700;font-size:11px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;white-space:nowrap}
.tag-ready{background:#e8f5e9;color:#1b5e20}.tag-inden{background:#fff8e1;color:#e65100}
.tag-obs{background:#fce4ec;color:#880e4f}.tag-admin{background:#e3f2fd;color:#0d47a1}.tag-user{background:#f3e5f5;color:#6a1b9a}
.msg-ok{background:#e8f5e9;color:#1b5e20;padding:10px 14px;border-radius:8px;font-size:12px;margin-top:8px;border:1px solid #a5d6a7}
.msg-err{background:#fce8e6;color:#b71c1c;padding:10px 14px;border-radius:8px;font-size:12px;margin-top:8px;border:1px solid #ef9a9a}
.imp-zone{border:2px dashed #c8cdd5;border-radius:12px;padding:28px;text-align:center;cursor:pointer;transition:all .2s}
.imp-zone:hover{border-color:#1a3a6b;background:#f0f6ff}
.saved-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:8px;border:1px solid #e1e4e8;margin-bottom:8px;background:#fafbfc;transition:all .15s}
.saved-item:hover{background:#f0f6ff;border-color:#1a3a6b}
.stat-box{background:#f5f8fc;border-radius:10px;padding:12px 16px;text-align:center}
.sv{font-size:22px;font-weight:700;color:#1a3a6b}.sl{font-size:11px;color:#7a8492;margin-top:2px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a3a6b 0%,#0e2540 100%);padding:20px}
.auth-box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center;padding:20px}
.modal-ov.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.form-row{margin-bottom:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{text-align:center;padding:32px;color:#9aa0aa}
.code-box{background:#f5f8fc;border:1px solid #e1e4e8;border-radius:8px;padding:12px;font-family:monospace;font-size:11px;white-space:pre;overflow-x:auto;line-height:1.6;color:#1a1a2e;margin:8px 0}
/* PRINT */
@media print{
  body{background:#fff}
  #app{display:none!important}
  #print-zone{display:block!important}
  @page{size:A4;margin:20.32mm}
}
#print-zone{display:none}
#print-doc{font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;color:#000;line-height:1.5}
.pt-logo{height:44px;object-fit:contain;display:block}
.pt-divider{border:none;border-bottom:2.5pt solid #1a3a6b;margin:6pt 0 10pt 0}
table.pt-sv{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:12pt}
table.pt-sv thead tr{background:#1a3a6b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.pt-sv th{padding:6pt 8pt;text-align:left;font-weight:600}
table.pt-sv td{padding:5pt 8pt;border-bottom:1pt solid #e0e0e0}
table.pt-sv td.r{text-align:right}
table.pt-sv .tot td{font-weight:700;border-top:2pt solid #1a3a6b;border-bottom:none;background:#f0f4f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.pt-sp{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:12pt}
table.pt-sp thead tr{background:#1a3a6b;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.pt-sp th{padding:6pt 7pt;text-align:left;font-weight:600}
table.pt-sp td{padding:4pt 7pt;border-bottom:1pt solid #e8e8e8;vertical-align:middle}
table.pt-sp td.r{text-align:right}.table.pt-sp td.c{text-align:center}
table.pt-sp .tot td{font-weight:700;border-top:1.5pt solid #1a3a6b;background:#f0f4f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pt-ready{background:#e8f5e9;color:#1b5e20;padding:1pt 5pt;border-radius:3pt;font-size:7.5pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
.pt-inden{background:#fff3e0;color:#e65100;padding:1pt 5pt;border-radius:3pt;font-size:7.5pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
.pt-japan{background:#e3f2fd;color:#0d47a1;padding:1pt 5pt;border-radius:3pt;font-size:7.5pt;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-zone"><div id="print-doc"></div></div>
<!-- SAVE MODAL -->
<div class="modal-ov" id="m-save">
  <div class="modal-box">
    <div style="font-size:16px;font-weight:700;margin-bottom:14px">💾 Simpan Penawaran</div>
    <div class="form-row"><label>Nama / Keterangan</label><input id="sv-name" type="text" placeholder="cth: Penawaran Bpk. Teguh – EK25BMHL"/></div>
    <div id="sv-no-preview" style="background:#e3f2fd;border-radius:6px;padding:8px 12px;font-size:12px;color:#1565c0;margin-bottom:14px;font-family:monospace"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('m-save')">Batal</button>
      <button id="sv-btn" class="btn btn-primary btn-sm" onclick="doSave()">💾 Simpan</button>
    </div>
  </div>
</div>
<!-- CREATE USER MODAL -->
<div class="modal-ov" id="m-cuser">
  <div class="modal-box">
    <div style="font-size:16px;font-weight:700;margin-bottom:16px">👤 Buat Akun User Baru</div>
    <div class="form-row"><label>Nama Lengkap</label><input id="nu-name" type="text" placeholder="Nama lengkap..."/></div>
    <div class="form-row"><label>Email</label><input id="nu-email" type="email" placeholder="email@contoh.com"/></div>
    <div class="form-row"><label>Password</label><input id="nu-pass" type="password" placeholder="Min. 6 karakter"/></div>
    <div class="form-row"><label>Role</label><select id="nu-role"><option value="user">User (Sales)</option><option value="admin">Admin</option></select></div>
    <div id="nu-err" style="display:none" class="msg-err"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="closeModal('m-cuser')">Batal</button>
      <button id="nu-btn" class="btn btn-primary btn-sm" onclick="doCreateUser()">Buat Akun</button>
    </div>
  </div>
</div>

function _today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){try{return new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})}catch{return s}}
function fmtDT(s){try{const d=s&&s.toDate?s.toDate():new Date(s);return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch{return '-'}}

function terbilang(n){n=Math.round(n);if(n===0)return'Nol';const s=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];function b(x){if(!x)return'';if(x<10)return s[x];if(x===10)return'sepuluh';if(x===11)return'sebelas';if(x<20)return s[x-10]+' belas';if(x<100)return s[Math.floor(x/10)]+' puluh'+(x%10?' '+s[x%10]:'');if(x<200)return'seratus'+(x%100?' '+b(x%100):'');if(x<1000)return s[Math.floor(x/100)]+' ratus'+(x%100?' '+b(x%100):'');if(x<2000)return'seribu'+(x%1000?' '+b(x%1000):'');if(x<1e6)return b(Math.floor(x/1000))+' ribu'+(x%1000?' '+b(x%1000):'');if(x<1e9)return b(Math.floor(x/1e6))+' juta'+(x%1e6?' '+b(x%1e6):'');return b(Math.floor(x/1e9))+' miliar'+(x%1e9?' '+b(x%1e9):'');}const r=b(n);return r.charAt(0).toUpperCase()+r.slice(1);}

/* FIREBASE INIT */
function initApp(){
  const cfgStr=localStorage.getItem(FB_KEY);
  if(!cfgStr){renderSetup();return;}
  let cfg;try{cfg=JSON.parse(cfgStr);}catch{localStorage.removeItem(FB_KEY);renderSetup();return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    else firebase.app();
    auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(async user=>{
      if(user){
        currentUser=user;
        try{const doc=await db.collection('users').doc(user.uid).get();userProfile=doc.exists?doc.data():{name:user.email,email:user.email,role:'user'};}
        catch{userProfile={name:user.email,email:user.email,role:'user'};}
        renderApp();
        loadPartsFromDB();
      }else{currentUser=null;userProfile=null;renderLogin();}
    });
  }catch(e){localStorage.removeItem(FB_KEY);renderSetup();}
}

/* PARTS LOADING */
async function loadPartsFromDB(){
  try{
    const meta=await db.collection('partsDB').doc('_meta').get();
    if(!meta.exists)return;
    const md=meta.data();
    const serverTs=md.lastUpdated?.toMillis?.()??0;
    const cachedTs=parseInt(localStorage.getItem('cvbn_pts_ts')||'0');
    const cached=localStorage.getItem('cvbn_pts');
    if(cached&&cachedTs>=serverTs){
      JSON.parse(cached).forEach(p=>DB_PARTS[p.c]=p);
      try{const sd=await db.collection('partsDB').doc('_stock').get();if(sd.exists)STOCK=sd.data().data||{};}catch{}
      updateDBCount();return;
    }
    const all=[];
    for(let i=0;i<md.totalChunks;i++){const c=await db.collection('partsDB').doc('chunk_'+i).get();if(c.exists)all.push(...c.data().parts);}
    try{const sd=await db.collection('partsDB').doc('_stock').get();if(sd.exists)STOCK=sd.data().data||{};}catch{}
    all.forEach(p=>DB_PARTS[p.c]=p);
    localStorage.setItem('cvbn_pts',JSON.stringify(all));
    localStorage.setItem('cvbn_pts_ts',String(serverTs));
    updateDBCount();
  }catch(e){console.error('Load parts error:',e);}
}
function updateDBCount(){const el=document.getElementById('db-count');if(el)el.textContent=Object.keys(DB_PARTS).length.toLocaleString();}

/* COUNTER */
async function getNextNum(){
  return db.runTransaction(async tx=>{
    const ref=db.collection('counters').doc('quotation');
    const snap=await tx.get(ref);
    const n=snap.exists?(snap.data().lastNum||0)+1:1;
    tx.set(ref,{lastNum:n});
    return n;
  });
}
function buildNo(num,hasSv,dateStr){
  const d=new Date(dateStr||_today());
  const day=String(d.getDate()).padStart(2,'0');
  const mon=ROM[d.getMonth()];
  const yr=String(d.getFullYear());
  return `SPBN ${hasSv?'Servis':'Yamaha Genuine Part'} ${String(num).padStart(3,'0')} ${day}${mon}${yr}`;
}
function previewNo(){
  const hasSv=showServis&&servisItems.length>0;
  const d=new Date(hdr.date||_today());
  return `SPBN ${hasSv?'Servis':'Yamaha Genuine Part'} NNN ${String(d.getDate()).padStart(2,'0')}${ROM[d.getMonth()]}${d.getFullYear()}`;
}

/* SAVE QUOTATION */
async function doSave(){
  const name=document.getElementById('sv-name')?.value.trim();
  if(!name){toast('Masukkan nama penawaran',false);return;}
  const btn=document.getElementById('sv-btn');
  try{
    if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';}
    const num=await getNextNum();
    const hasSv=showServis&&servisItems.length>0;
    const noSurat=buildNo(num,hasSv,hdr.date);
    hdr.noSurat=noSurat;
    await db.collection('quotations').add({
      name,noSurat,date:hdr.date,customer:hdr.customer,
      subject:hdr.subject,perihalUnit:hdr.perihalUnit||'',
      items:JSON.parse(JSON.stringify(items)),
      servisItems:JSON.parse(JSON.stringify(servisItems)),
      showServis,
      createdBy:currentUser.uid,
      createdByName:userProfile.name||userProfile.email,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    });
    closeModal('m-save');
    toast('✅ Disimpan: '+noSurat);
    const noEl=document.getElementById('f-no');if(noEl)noEl.value=noSurat;
  }catch(e){toast('Gagal simpan: '+e.message,false);}
  finally{if(btn){btn.disabled=false;btn.innerHTML='💾 Simpan';}}
}

function openSaveModal(){
  const hasSv=showServis&&servisItems.length>0;
  document.getElementById('sv-name').value=hdr.customer?`Penawaran ${hdr.customer}`:'Penawaran';
  document.getElementById('sv-no-preview').textContent='Nomor akan dibuat: '+previewNo();
  openModal('m-save');
  setTimeout(()=>document.getElementById('sv-name')?.select(),60);
}

/* LOAD QUOTATIONS */
async function loadMyQ(){
  const snap=await db.collection('quotations').where('createdBy','==',currentUser.uid).get();
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{ const ta=a.createdAt?.toMillis?.()??0; const tb=b.createdAt?.toMillis?.()??0; return tb-ta; });
}
async function loadAllQ(){
  const snap=await db.collection('quotations').get();
  return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{ const ta=a.createdAt?.toMillis?.()??0; const tb=b.createdAt?.toMillis?.()??0; return tb-ta; });
}
async function deleteQ(id){
  if(!confirm('Hapus penawaran ini?'))return;
  await db.collection('quotations').doc(id).delete();
  toast('Penawaran dihapus');

async function loadAndEdit(id){
  try{
    const doc=await db.collection('quotations').doc(id).get();
    if(!doc.exists){toast('Tidak ditemukan',false);return;}
    const d=doc.data();
    hdr={noSurat:d.noSurat||'',date:d.date||_today(),customer:d.customer||'',subject:d.subject||'',perihalUnit:d.perihalUnit||''};

    showServis=d.showServis||servisItems.length>0;
    activeTab='quote';renderApp();toast('✓ Penawaran dimuat');
  }catch(e){toast('Gagal: '+e.message,false);}
}

/* UPLOAD PARTS */
async function uploadParts(partsArr,stockMap){
  const CHUNK=4000,n=Math.ceil(partsArr.length/CHUNK);
  const ps=[];
  for(let i=0;i<n;i++)ps.push(db.collection('partsDB').doc('chunk_'+i).set({parts:partsArr.slice(i*CHUNK,(i+1)*CHUNK)}));
  if(Object.keys(stockMap).length)ps.push(db.collection('partsDB').doc('_stock').set({data:stockMap}));
  ps.push(db.collection('partsDB').doc('_meta').set({totalChunks:n,totalParts:partsArr.length,lastUpdated:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:userProfile?.name||'admin'}));
  await Promise.all(ps);
  partsArr.forEach(p=>DB_PARTS[p.c]=p);
  if(Object.keys(stockMap).length)STOCK=stockMap;
  localStorage.setItem('cvbn_pts',JSON.stringify(partsArr));
  localStorage.setItem('cvbn_pts_ts',Date.now().toString());
}

/* USER MANAGEMENT */
async function doCreateUser(){
  const name=document.getElementById('nu-name').value.trim();
  const email=document.getElementById('nu-email').value.trim();
  const pass=document.getElementById('nu-pass').value;
  const role=document.getElementById('nu-role').value;
  const errEl=document.getElementById('nu-err');
  const btn=document.getElementById('nu-btn');
  if(!name||!email||pass.length<6){errEl.textContent='Semua field wajib + password min 6 karakter';errEl.style.display='block';return;}
  try{
    errEl.style.display='none';btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    // Create in secondary app to avoid signing out admin
    const secName='sec_'+Date.now();
    const secApp=firebase.initializeApp(firebase.app().options,secName);
    const secAuth=secApp.auth();
    const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
    await db.collection('users').doc(cred.user.uid).set({name,email,role,createdBy:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    await secAuth.signOut();
    await secApp.delete();
    closeModal('m-cuser');
    toast(`✅ User "${name}" berhasil dibuat`);
    renderAdminUsers();
  }catch(e){errEl.textContent=e.message;errEl.style.display='block';}
  finally{btn.disabled=false;btn.innerHTML='Buat Akun';}
}
async function deleteUserDoc(uid){
  if(!confirm('Hapus user ini dari daftar?'))return;
  await db.collection('users').doc(uid).delete();
  toast('User dihapus');renderAdminUsers();
}

/* SCREENS */
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isAuth() { return request.auth != null; }
    function isAdmin() {
      return isAuth() &&
        get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'admin';
    }
    match /users/{uid} {
      allow read: if isAuth();
      allow create: if isAuth() && (isAdmin() || !exists(/databases/$(database)/documents/config/app));
      allow update,delete: if isAdmin();
    }
    match /config/{d} { allow read,write: if isAuth(); }
    match /partsDB/{d} { allow read: if isAuth(); allow write: if isAdmin(); }
    match /quotations/{d} {
      allow read: if isAuth() && (resource.data.createdBy == request.auth.uid || isAdmin());
      allow create: if isAuth();
      allow update,delete: if isAuth() && (resource.data.createdBy == request.auth.uid || isAdmin());
    }
    match /counters/{d} { allow read,write: if isAuth(); }
  }
}`;

function submitSetup(){
  const val=document.getElementById('fb-cfg').value.trim();
  const errEl=document.getElementById('s-err');
  try{
    const m=val.match(/\{[\s\S]+\}/);
    if(!m)throw new Error('Format tidak valid');
    let cfg;
    try{cfg=JSON.parse(m[0]);}
    catch{const q=m[0].replace(/([{,]\s*)([a-zA-Z_]\w*)\s*:/g,'$1"$2":');cfg=JSON.parse(q);}
    if(!cfg.apiKey||!cfg.projectId)throw new Error('apiKey dan projectId wajib ada');
    localStorage.setItem(FB_KEY,JSON.stringify(cfg));
    errEl.style.display='none';
    initApp();

async function handlePL(el){
  if(!el.files[0])return;
  const msg=document.getElementById('pl-msg');
  msg.innerHTML=`<div style="color:#1565c0;padding:10px;font-size:12px">⏳ Membaca file...</div>`;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const allRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      let hRow=-1,col={};
      for(let i=0;i<Math.min(10,allRows.length);i++){
        const r=allRows[i].map(c=>String(c).trim().toLowerCase());
        if(r.findIndex(c=>c==='part#'||c==='part number'||c==='code'||c==='kode')>=0){
          hRow=i;
          r.forEach((h,idx)=>{
            if(h==='part#'||h==='part number'||h==='code'||h==='kode')col.code=idx;
            else if(h==='description'||h==='name'||h==='nama'||h==='item name')col.name=idx;
            else if(h.includes('price')||h.includes('harga')||h==='retail price inc ppn')col.price=idx;
            else if(h.includes('superseding to'))col.sup=idx;
            else if(h.includes('final supersession'))col.final=idx;
            else if(h==='stock'||h==='stok'||h==='qty')col.stock=idx;
          });break;
        }
      }
      if(hRow<0||col.code===undefined){msg.innerHTML=`<div class="msg-err">Kolom Part# tidak ditemukan</div>`;return;}
      const parts=[],stockMap={};
      allRows.slice(hRow+1).forEach(row=>{
        const code=String(row[col.code]||'').trim();if(!code)return;
        parts.push({c:code,n:String(row[col.name]||'').trim(),p:Math.round(parseFloat(row[col.price])||0),
          s:col.sup!==undefined?String(row[col.sup]||'').trim():'',
          f:col.final!==undefined?String(row[col.final]||'').trim():''});
        if(col.stock!==undefined&&row[col.stock])stockMap[code]=parseInt(row[col.stock])||0;
      });
      msg.innerHTML=`<div style="color:#1565c0;padding:10px;font-size:12px">⏳ Mengupload ${parts.length.toLocaleString()} part ke Firestore...</div>`;
      await uploadParts(parts,stockMap);
      msg.innerHTML=`<div class="msg-ok">✓ ${parts.length.toLocaleString()} part berhasil diupload!</div>`;
      updateDBCount();renderAdminParts();
    }catch(e){msg.innerHTML=`<div class="msg-err">Error: ${e.message}</div>`;}
  };
  reader.readAsBinaryString(el.files[0]);
}

async function handleSTK(el){
  if(!el.files[0])return;
  const msg=document.getElementById('stk-msg');
  msg.innerHTML=`<div style="color:#1565c0;padding:10px;font-size:12px">⏳ Membaca...</div>`;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      const sm={};rows.forEach(r=>{const code=String(r.code||r.Code||r['Part#']||r['Kode']||'').trim();const stk=parseInt(r.stock||r.Stock||r.Stok||r.QTY||0);if(code)sm[code]=stk;});
      await db.collection('partsDB').doc('_stock').set({data:sm});

/* SUPERSESSION & SEARCH */
function resolve(code){
  const norm=c=>c.trim().toUpperCase();
  const find=c=>DB_PARTS[c]||DB_PARTS[Object.keys(DB_PARTS).find(k=>k.toUpperCase()===c)];
  let cur=norm(code),visited=new Set(),hops=[];
  for(let i=0;i<8;i++){
    if(visited.has(cur))break;visited.add(cur);
    const e=find(cur);if(!e)break;
    const nxt=e.f?norm(e.f):'';
    if(nxt&&nxt!==cur){hops.push(cur);cur=nxt;}
    else return{final:e,hops,changed:hops.length>0};
  }
  return{final:find(cur)||null,hops,changed:hops.length>0};
}
const getStock=c=>STOCK[c]||0;

function onSearchInput(val){
  if(val.length<1){sugg=[];dropVisible=false;renderDrop();return;}
  const q=val.toLowerCase().replace(/-/g,'');
  sugg=Object.values(DB_PARTS).filter(d=>d.c.toLowerCase().replace(/-/g,'').includes(q)||d.n.toLowerCase().includes(q)).slice(0,12);
  dropVisible=true;activeIdx=-1;renderDrop();
}
function onSearchKey(e){
  if(!dropVisible||!sugg.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();activeIdx=Math.min(activeIdx+1,sugg.length-1);renderDrop();}
  else if(e.key==='ArrowUp'){e.preventDefault();activeIdx=Math.max(activeIdx-1,-1);renderDrop();}
  else if(e.key==='Enter'){e.preventDefault();pickSugg(activeIdx>=0?activeIdx:0);}
  else if(e.key==='Escape'){dropVisible=false;renderDrop();}
}
function renderDrop(){
  const wrap=document.getElementById('drop-wrap');if(!wrap)return;
  if(!dropVisible||!sugg.length){const v=document.getElementById('srch-input')?.value||'';wrap.innerHTML=(!dropVisible||v.length<1)?'':`<div class="drop"><div style="padding:12px 14px;color:#7a8492;font-size:12px">${!Object.keys(DB_PARTS).length?'Database kosong':'Tidak ditemukan'}</div></div>`;return;}
  wrap.innerHTML=`<div class="drop">${sugg.map((s,i)=>{const res=resolve(s.c),fp=res.final||s,stk=getStock(fp.c);return `<div class="ditem${i===activeIdx?' hl':''}" onmousedown="pickSugg(${i})"><div style="min-width:0"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="mono">${s.c}</span>${res.changed?`<span class="tag tag-obs">OBSOLETE</span><span style="font-size:10px;color:#1565c0;font-family:monospace">→ ${fp.c}</span>`:''}</div><div style="font-size:12px;color:#57606a;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:360px">${res.changed?fp.n:s.n}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0"><span style="font-size:12px;font-weight:700;color:#1a3a6b">Rp ${fmt(fp.p)}</span><span class="tag ${stk>0?'tag-ready':'tag-inden'}">${stk>0?'Stk: '+stk:'Stok 0'}</span></div></div>`;}).join('')}</div>`;
}
function pickSugg(idx){
  const s=sugg[idx];if(!s)return;
  const res=resolve(s.c),fp=res.final||s,stk=getStock(fp.c);
  items.push({id:Date.now()+Math.random(),code:fp.c,name:fp.n,qty:1,price:fp.p,origPrice:fp.p,disc:0,stock:stk,status:stk>0?'READY':'INDEN JKT',supersededFrom:res.changed?s.c:null});
  const inp=document.getElementById('srch-input');if(inp){inp.value='';inp.focus();}
  sugg=[];dropVisible=false;activeIdx=-1;renderDrop();renderTableOnly();
}

/* ITEM OPS */
function removeItem(id){items=items.filter(i=>i.id!==id);renderTableOnly();}
function upQty(id,v){const it=items.find(x=>x.id===id);if(!it)return;const q=Math.max(1,parseInt(v)||1);it.qty=q;if(it.stock>0&&q>it.stock)it.status='INDEN JKT';else if(it.stock>0&&q<=it.stock)it.status='READY';renderTableOnly();}
function upPriceManual(id,v){
  const it=items.find(x=>x.id===id);if(!it)return;
  const p=parseFloat(v)||0;it.price=p;
  it.disc=it.origPrice>0?parseFloat(((1-p/it.origPrice)*100).toFixed(2)):0;
  const de=document.getElementById('disc-'+it.id);if(de)de.value=it.disc;
  const oe=document.getElementById('orig-'+it.id);if(oe)oe.textContent=it.price!==it.origPrice?'Rp '+fmt(it.origPrice):'';
  const se=document.getElementById('sub-'+it.id);if(se)se.textContent='Rp '+fmt(it.qty*p);
  updateTotalOnly();
}
function upDisc(id,v){
  const it=items.find(x=>x.id===id);if(!it)return;
  const d=parseFloat(v)||0;it.disc=d;it.price=Math.round(it.origPrice*(1-d/100));
  const pe=document.getElementById('price-'+it.id);if(pe)pe.value=it.price;
  const oe=document.getElementById('orig-'+it.id);if(oe)oe.textContent=it.price!==it.origPrice?'Rp '+fmt(it.origPrice):'';
  const se=document.getElementById('sub-'+it.id);if(se)se.textContent='Rp '+fmt(it.qty*it.price);
  updateTotalOnly();
}
function upStatus(id,v){const it=items.find(x=>x.id===id);if(it)it.status=v;}
